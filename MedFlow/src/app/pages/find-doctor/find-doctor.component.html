<div class="app-layout">

  <app-sidebar></app-sidebar>

  <div class="main-content">

    <div class="page-content">

      <header class="page-header">
        <div>
          <h1>Find Doctor</h1>
          <p>Search and book the best specialists</p>
        </div>
      </header>

      <div class="search-section">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input
            type="text"
            placeholder="Search doctors, specialties..."
            [(ngModel)]="searchTerm"
            (input)="filterDoctors()"
          />
        </div>

        <div class="filters">
          <button
            class="filter-btn"
            *ngFor="let spec of specialties"
            [class.active]="selectedSpecialty === spec"
            (click)="selectSpecialty(spec)"
          >
            {{ spec }}
          </button>
        </div>
      </div>

      <!-- Loading -->
      <div *ngIf="loading" class="loading-state">
        <p>Loading doctors...</p>
      </div>

      <!-- Empty state -->
      <div *ngIf="!loading && filteredDoctors.length === 0" class="empty-state">
        <p>No doctors found.</p>
      </div>

      <div class="doctors-grid" *ngIf="!loading">

        <div class="doctor-card card" *ngFor="let doc of filteredDoctors">

          <div class="doc-avatar">{{ doc.avatar }}</div>

          <div class="doc-info">
            <h3>{{ doc.name }}</h3>
            <p class="specialty">{{ doc.specialty }}</p>
            <div class="meta">⭐ {{ doc.rating }} • {{ doc.experience }} yrs</div>
            <div class="fee">${{ doc.consultationFee }} consultation</div>
          </div>

          <button class="book-btn" (click)="bookDoctor(doc.id)">
            Book Appointment
          </button>

        </div>

      </div>

    </div>
  </div>
</div>
