<div class="app-layout" *ngIf="doctor">

  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main -->
  <div class="main-content">

    <app-alert
      [message]="alertMessage"
      [type]="alertType"
      [visible]="alertVisible"
      (close)="onAlertClose()"
    ></app-alert>
    
    <div class="page-container">

      <!-- Header -->
      <header class="page-header">
        <button class="icon-btn" (click)="goBack()">←</button>
        <h2>Book Appointment</h2>
        <div class="spacer"></div>
      </header>

      <!-- Doctor -->
      <div class="doctor-card card">
        <div class="avatar">{{ doctor.avatar }}</div>

        <div class="info text-center">
          <h3>{{ doctor.name }}</h3>
          <p>{{ doctor.specialty }} • {{ doctor.experience }} yrs</p>
          <span>⭐ {{ doctor.rating }} ({{ doctor.reviews }})</span>
        </div>
      </div>

      <!-- ✅ NEW: Split Layout -->
      <div class="booking-layout">

        <!-- LEFT: CALENDAR -->
        <div class="calendar-section card">

          <div class="calendar-header">
            <button (click)="prevMonth()" [disabled]="isPastMonth()">‹</button>
            <h3>{{ currentMonth }}</h3>
            <button (click)="nextMonth()">›</button>
          </div>

          <div class="weekdays">
            <span *ngFor="let d of weekdays">{{ d }}</span>
          </div>

          <div class="days">
            <button
              *ngFor="let d of calendarDays"
              class="day"
              [class.active]="d === selectedDay"
              (click)="selectDay(d)"
              [disabled]="isPastDay(d)"
            >
              {{ d }}
            </button>
          </div>

        </div>

        <!-- RIGHT: SLOTS -->
        <div class="slots-section">

          <h3>Available Time</h3>

          <div class="slots">
            <button
              *ngFor="let slot of timeSlots"
              class="slot"
              [class.active]="slot.time === selectedSlot"
              [disabled]="!slot.available"
              (click)="selectSlot(slot)"
            >
              {{ slot.time }}
            </button>
          </div>

        </div>

      </div>

      <!-- Info -->
      <div class="info-banner">
        ℹ️ Please arrive 15 minutes early
      </div>

    </div>

    <!-- Footer -->
    <div class="footer">
      <div>
        <small>Total</small>
        <h3>${{ doctor.consultationFee }}</h3>
      </div>

      <button class="btn-primary" (click)="confirmBooking()">
        {{ confirmed ? 'Booked ✅' : 'Confirm' }}
      </button>
    </div>

    <app-navbar activePage="appointments"></app-navbar>

  </div>
</div>
