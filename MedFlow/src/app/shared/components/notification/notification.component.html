<!-- Overlay -->
<div
  class="notif-overlay"
  (click)="closePanel()"
></div>

<!-- Notification Panel -->
<div class="notif-wrapper">

  <!-- Header -->
  <div class="notif-header">

    <h3>Notifications</h3>

    <div class="notif-actions">

      <button
        class="clear-btn"
        (click)="clearAll()"
      >
        Clear All
      </button>

      <button
        class="close-btn"
        (click)="closePanel()"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

    </div>

  </div>

  <!-- Empty State -->
  <div
    class="empty-state"
    *ngIf="notifications.length === 0"
  >
    <i class="fa-regular fa-bell-slash"></i>

    <p>No notifications yet</p>
  </div>

  <!-- List -->
  <div
    class="notif-list"
    *ngIf="notifications.length > 0"
  >

    <div
      class="notif-item"
      *ngFor="let n of notifications"
      [class.unread]="!n.read"
    >

      <div class="notif-icon">
        <i class="fa-solid" [ngClass]="n.icon"></i>
      </div>

      <div class="notif-content">

        <p class="notif-title">
          {{ n.title }}
        </p>

        <span class="notif-time">
          {{ n.time }}
        </span>

      </div>

    </div>

  </div>

</div>
